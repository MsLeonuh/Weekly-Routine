<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weekly Routine</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--ivory:#FBF8F1;--paper:#FFFDF8;--navy:#14213D;--gold:#B08D3E;--gold-line:#D9C79A;--gold-soft:#F3EBD7;--muted:#7C776B}
*{box-sizing:border-box}
body{margin:0;background:var(--ivory);color:var(--navy);font-family:Inter,system-ui,sans-serif;padding:28px 16px 70px}
.wrap{max-width:520px;margin:0 auto}
.eyebrow{text-align:center;font-size:11px;letter-spacing:.32em;text-transform:uppercase;color:var(--gold)}
h1{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-weight:500;font-size:44px;text-align:center;margin:6px 0 4px;color:var(--navy)}
.rule{border:0;border-top:1px solid var(--gold);border-bottom:1px solid var(--gold);height:4px;margin:10px auto 12px;width:140px}
.sub{text-align:center;color:var(--muted);font-size:13px;letter-spacing:.06em;margin:0 0 24px}
.bar{height:3px;background:var(--gold-soft)}
.bar i{display:block;height:100%;width:0;background:var(--gold);transition:width .35s}
.stat{display:flex;justify-content:space-between;font-size:12px;letter-spacing:.05em;color:var(--muted);margin:8px 0 20px}
.mode{display:flex;margin-bottom:18px;border:1px solid var(--gold-line)}
.mode button{flex:1;padding:11px 6px;border:0;background:var(--paper);font:inherit;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.mode button+button{border-left:1px solid var(--gold-line)}
.mode button.on{background:var(--navy);color:var(--gold-line)}
.days{display:flex;gap:5px;margin-bottom:18px}
.days button{flex:1;padding:11px 0;border:1px solid var(--gold-line);background:var(--paper);font-family:'Cormorant Garamond',Georgia,serif;font-size:16px;font-weight:600;color:var(--navy)}
.days button.on{background:var(--navy);color:var(--gold-line);border-color:var(--navy)}
.days button.today:not(.on){border-color:var(--gold);color:var(--gold)}
.card{border:1px solid var(--gold-line);background:var(--paper);padding:4px 16px;box-shadow:0 1px 0 var(--gold-soft)}
.task{display:flex;align-items:center;gap:14px;padding:15px 0;border-bottom:1px solid var(--gold-soft);cursor:pointer}
.task:last-child{border-bottom:0}
.box{width:22px;height:22px;border:1px solid var(--gold);flex:none;display:flex;align-items:center;justify-content:center;color:var(--gold-line);font-size:13px}
.task.done .box{background:var(--navy);border-color:var(--navy)}
.task.done .t{text-decoration:line-through;text-decoration-color:var(--gold);color:var(--muted)}
.t{font-family:'Cormorant Garamond',Georgia,serif;font-size:19px;font-weight:600;line-height:1.2}
.when{font-size:12px;color:var(--muted);margin-top:2px}
.tag{margin-left:auto;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);border:1px solid var(--gold-line);padding:3px 8px;white-space:nowrap}
.water{padding:15px 0;border-bottom:1px solid var(--gold-soft)}
.cups{display:flex;gap:5px;margin-top:11px}
.cups span{flex:1;height:26px;border:1px solid var(--gold);background:var(--paper);cursor:pointer}
.cups span.f{background:var(--gold)}
.reset{display:block;margin:26px auto 0;background:none;border:0;color:var(--muted);font:inherit;font-size:12px;letter-spacing:.08em;text-decoration:underline}
</style>
</head>
<body>
<div class="wrap">
<div class="eyebrow">Discipline &middot; Focus &middot; Freedom</div>
<h1>My Week</h1>
<hr class="rule">
<p class="sub" id="sub"></p>
<div class="bar"><i id="fill"></i></div>
<div class="stat"><span id="count"></span><span id="pct"></span></div>
<div class="mode">
  <button id="mFull">Full week</button>
  <button id="mBusy">Busy week &middot; core only</button>
</div>
<div class="days" id="days"></div>
<div class="card" id="list"></div>
<button class="reset" id="reset">Start a fresh week</button>
</div>

<script>
/* EDIT HERE: your routine. core:true = stays on in Busy week mode. days: 0=Mon ... 6=Sun */
const DAYS=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const TASKS=[
 {id:'trade',t:'Day trading (paper)',when:'6 to 9am',days:[0,1,2,3,4],core:true},
 {id:'options',t:'Options and market study',when:'45 min, learn then practice',days:[0,1,2,3,4]},
 {id:'outreach',t:'Cold outreach: 20 emails',when:'Jobs, middleman, people to learn from',days:[0,1,2,3,4],core:true},
 {id:'jobs1',t:'Job hunting',when:'3 to 5pm',days:[0,1],core:true},
 {id:'jobs2',t:'Job hunting',when:'2 to 4pm',days:[2],core:true},
 {id:'jobs3',t:'Job hunting',when:'1 hour',days:[3,4],core:true},
 {id:'cash',t:'Cashflow build',when:'Dropshipping, app or middleman, 1 hour',days:[0,1,2,3,4]},
 {id:'call',t:'One business call or meeting',when:'Weekly goal',days:[1],core:true,tag:'Weekly'},
 {id:'ground',t:'Affirmations / meditation',when:'10 min, on its own',days:[0,1,2,3,4,5,6],core:true},
 {id:'read',t:'Read your book',when:'20 min',days:[0,1,2,3,4,5,6]},
 {id:'pilates',t:'Pilates',when:'30 to 40 min',days:[0,1,3,4],core:true},
 {id:'stretch',t:'Stretching',when:'15 min',days:[2,5,6]},
 {id:'hike',t:'Hike or outdoor activity',when:'Weekend must',days:[5],core:true,tag:'Weekly'},
 {id:'social',t:'Socialize or do something new',when:'Yacht club, event, or a first-time thing',days:[6],tag:'Weekly'},
 {id:'review',t:'Weekly review',when:'10 min',days:[6]}
];
const WATER_GOAL=2000, CUP=250;

let S={week:'',mode:'full',done:{},water:{}};
const mondayKey=()=>{const d=new Date();const w=(d.getDay()+6)%7;d.setDate(d.getDate()-w);return d.toISOString().slice(0,10)};
const todayIdx=()=>(new Date().getDay()+6)%7;
let cur=todayIdx();

function load(){
  try{const r=localStorage.getItem('routine-v1');if(r)S=JSON.parse(r)}catch(e){}
  if(S.week!==mondayKey()){S={week:mondayKey(),mode:S.mode||'full',done:{},water:{}}}
}
function save(){try{localStorage.setItem('routine-v1',JSON.stringify(S))}catch(e){}}
const visible=(t)=>S.mode==='full'||t.core;

function render(){
  document.getElementById('sub').textContent='Week of '+new Date(S.week+'T12:00:00').toLocaleDateString('en-CA',{month:'long',day:'numeric'});
  document.getElementById('mFull').className=S.mode==='full'?'on':'';
  document.getElementById('mBusy').className=S.mode==='busy'?'on':'';
  const dv=document.getElementById('days');dv.innerHTML='';
  DAYS.forEach((n,i)=>{const b=document.createElement('button');b.textContent=n;
    b.className=(i===cur?'on ':'')+(i===todayIdx()?'today':'');
    b.onclick=()=>{cur=i;render()};dv.appendChild(b)});
  const L=document.getElementById('list');L.innerHTML='';
  const w=S.water[cur]||0;
  const wd=document.createElement('div');wd.className='water';
  wd.innerHTML='<div class="t">Water: '+(w/1000)+' of 2 L</div><div class="cups"></div>';
  const cups=wd.querySelector('.cups');
  for(let i=0;i<WATER_GOAL/CUP;i++){const s=document.createElement('span');
    if(w>i*CUP)s.className='f';
    s.onclick=()=>{S.water[cur]=(w===(i+1)*CUP)?i*CUP:(i+1)*CUP;save();render()};cups.appendChild(s)}
  L.appendChild(wd);
  TASKS.filter(t=>t.days.includes(cur)&&visible(t)).forEach(t=>{
    const k=cur+'-'+t.id;const d=document.createElement('div');
    d.className='task'+(S.done[k]?' done':'');
    d.innerHTML='<div class="box">'+(S.done[k]?'&#10003;':'')+'</div><div><div class="t">'+t.t+'</div><div class="when">'+t.when+'</div></div>'+(t.tag?'<span class="tag">'+t.tag+'</span>':'');
    d.onclick=()=>{S.done[k]=!S.done[k];save();render()};L.appendChild(d)});
  let total=0,got=0;
  for(let d=0;d<7;d++){
    TASKS.filter(t=>t.days.includes(d)&&visible(t)).forEach(t=>{total++;if(S.done[d+'-'+t.id])got++});
    total++;if((S.water[d]||0)>=WATER_GOAL)got++;
  }
  const p=total?Math.round(got/total*100):0;
  document.getElementById('fill').style.width=p+'%';
  document.getElementById('count').textContent=got+' of '+total+' done this week';
  document.getElementById('pct').textContent=p+'%';
}
document.getElementById('mFull').onclick=()=>{S.mode='full';save();render()};
document.getElementById('mBusy').onclick=()=>{S.mode='busy';save();render()};
document.getElementById('reset').onclick=()=>{if(confirm('Clear this week\u2019s checkmarks?')){S.done={};S.water={};save();render()}};
load();render();
</script>
</body>
</html>
